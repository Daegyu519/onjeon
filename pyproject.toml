[project]
name = "onjeon"
version = "0.1.0"
description = "온전(穩全) — 리스크 조정 주거비용 기반 청년 주거 의사결정 AI (KB Future Finance A.I. Challenge MVP)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "streamlit>=1.38",
    "jsonschema>=4.23",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "qdrant-client>=1.12",
    "pydantic>=2.7",
    "tenacity>=9.0",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "fastapi>=0.115",
    # dev.sh·serve.sh가 `.venv/bin/uvicorn`을 직접 실행한다. 여기 없으면
    # `pip install -e .`만 한 환경에서 서버가 기동조차 못 한다(제출물 심사 환경이 그렇다).
    # requirements-api.txt에도 따로 있다 — 컨테이너 경로는 그쪽을 쓴다(CLAUDE.md 함정 5).
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0", "anthropic>=0.40"]
rag = ["fastembed>=0.4"]
xai = ["shap>=0.46"]
dev = ["pytest>=8.3"]
# 문서 빌드 전용 — scripts/build_deck.py(덱 → pptx/pdf). 런타임·테스트에는 필요 없다.
docs = ["python-pptx>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onjeon = ["rules/*.json", "rules/products/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
