# ⚠️ 미채택 — 현재 배포 경로가 아니다. 실제 공개는 ./tunnel.sh(ngrok 고정 도메인)가 한다.
#
# 왜 안 쓰는가 (2026-07 확인): Render 무료 티어는 가입에 카드가 필요 없지만, 결제수단이
# 등록되지 않은 워크스페이스의 무료 서비스를 그 달 남은 기간 정지시킨다(render.com/docs/free).
# 즉 카드 등록이 사실상 조건이다. 같은 이유로 검토한 대안도 전부 막혔다:
#   Koyeb 무료 = 신규 가입 폐쇄(2026 Mistral 인수), HF Spaces Docker = PRO $9/mo,
#   Back4App = 256MB라 등기부 OCR이 OOM, Fly/Railway/Cloud Run/Oracle = 카드 필수.
#
# 이 파일은 지워지지 않고 남아 있다 — 카드를 등록할 수 있게 되면 그날 바로 쓸 수 있는
# 검증된 경로이기 때문이다. 그때 할 일: (1) 아래 branch 핀을 main으로 옮기거나 삭제,
# (2) main에 render.yaml과 data/cache.db.gz를 병합(현재 main엔 Dockerfile만 있다),
# (3) MOLIT_API_KEY는 읽기 전용 모드에서 쓰이지 않으므로 비워도 된다.
#
# ── 이하 원본 설정 ──────────────────────────────────────────────
# Render Blueprint — 온전 웹(FastAPI 단일 서버가 프론트+API 서빙).
#
# 사용: Render 대시보드 → New → Blueprint → 이 리포 선택 → Apply.
#   이후 Environment에 MOLIT_API_KEY 추가(값은 여기 넣지 않는다 — sync:false).
#
# 무료 플랜 특성: 15분 유휴 후 슬립, 첫 요청이 30~50초 걸린다(이후 정상 속도).
#   시연 직전에 한 번 열어 깨워두면 된다.
services:
  - type: web
    name: onjeon
    runtime: docker
    plan: free
    # Dockerfile은 리포 루트(rootDir 기본값)에 있으므로 경로 지정 불필요.
    # Render가 자체 linux/amd64 인프라에서 직접 빌드하므로 맥(arm64)과 무관하다.
    healthCheckPath: /openapi.json
    envVars:
      # 공개 배포는 캐시만 읽고 국토부 API를 호출하지 않는다(요청당 최대 183회 →
      # 인증 없는 공개 경로에서 운영자 키 쿼터가 소진되는 것을 막는다).
      - key: ONJEON_PUBLIC_READONLY
        value: "1"
      # Render가 주입하는 PORT를 그대로 사용(Dockerfile CMD가 ${PORT}를 읽는다).
      - key: MOLIT_API_KEY
        sync: false # 대시보드에서 직접 입력 — 리포에 키를 남기지 않는다
